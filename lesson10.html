<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Gamedev Canvas Workshop - lesson 10: finishing up</title>
    <style>
    * { padding: 0; margin: 0; } 
    canvas { background: #eee; display: block; margin: 0 auto; }
            /* 难度选择界面的样式 */
        #difficultyContainer { 
            text-align: center; 
            margin-top: 150px; 
        }
        #difficultyContainer button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;            
            cursor: pointer;
            background-color: #0095DD;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #difficultyContainer button:hover {
            background-color: #0077BB;
        }
    </style>
</head>
<body>

    <!-- 画布 -->
    <canvas id="myCanvas" width="480" height="320" style="display:none;"></canvas> <!-- 【修改】初始隐藏 -->

    <!-- 难度选择界面 -->
    <div id="difficultyContainer">
        <h2>请选择游戏难度</h2>
        <button id="easyBtn">简单</button>
        <button id="mediumBtn">中等</button>
        <button id="hardBtn">困难</button>
    </div>

<script>//以下为JS代码
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    var ballRadius = 10;//球的半径
    var x = canvas.width/2;//球的初始位置
    var y = canvas.height-30;
    var dx ;//球的速度
    var dy ;

    var paddleHeight = 10;//挡板尺寸
    var paddleWidth = 75;
    var paddleX = (canvas.width-paddleWidth)/2;//挡板的初始位置

    var rightPressed = false;//按键状态
    var leftPressed = false;

    var brickRowCount = 5;//砖块摆放
    var brickColumnCount = 3;
    var brickWidth = 75;//砖块尺寸
    var brickHeight = 20;
    var brickPadding = 10;//砖块间距
    var brickOffsetTop = 30;//砖块起始位置
    var brickOffsetLeft = 30;
    
    var score = 0;//分数
    var lives = 3;//生命值
    var difficulty = null;//记录选择的难度
    var gameStarted = false;//标记游戏是否已经开始

    var bricks = [];

    function initBricks() //砖块数组初始化
    {
    bricks = [];
    for(var c=0; c<brickColumnCount; c++) {
        bricks[c] = [];
        for(var r=0; r<brickRowCount; r++) {
            bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
    }
}

// 难度选择按钮事件监听
document.getElementById("easyBtn").addEventListener("click", function() {
    startGame("easy");
});
document.getElementById("mediumBtn").addEventListener("click", function() {
    startGame("medium");
});
document.getElementById("hardBtn").addEventListener("click", function() {
    startGame("hard");
});

function startGame(level) {
    difficulty = level;
    // 根据难度设置球速
    if (level === "easy") {
        dx = 2; dy = -2;
    } else if (level === "hard") {
        dx = 5; dy = -5;
    } else {
        dx = 3; dy = -3;
    }

    // 隐藏难度选择界面，显示画布
    document.getElementById("difficultyContainer").style.display = "none";
    canvas.style.display = "block";

    // 初始化游戏状态
    score = 0;
    lives = 3;
    initBricks();

    // 启动游戏绘制
    gameStarted = true;
    draw();
}

    document.addEventListener("keydown", keyDownHandler, false);//监听按键 按下
    document.addEventListener("keyup", keyUpHandler, false);//监听按键 松开
    //document.addEventListener("mousemove", mouseMoveHandler, false); //监听鼠标移动



    function keyDownHandler(e) //addEventListener监听到按键时返回e
    {
        if(e.code  == "ArrowRight") 
        {
            rightPressed = true;
        }
        else if(e.code == 'ArrowLeft') 
        {
            leftPressed = true;
        }
    }
    function keyUpHandler(e) 
    {
        if(e.code == 'ArrowRight') 
        {
            rightPressed = false;
        }
        else if(e.code == 'ArrowLeft') 
        {
            leftPressed = false;
        }
    }
/*     
    function mouseMoveHandler(e) 
    {
        var relativeX = e.clientX - canvas.offsetLeft;
        if(relativeX > 0 && relativeX < canvas.width) {
            paddleX = relativeX - paddleWidth/2;
        }
    } 
*/
    function collisionDetection() //检测球与砖块碰撞
    {
        for(var c=0; c<brickColumnCount; c++) 
        {
            for(var r=0; r<brickRowCount; r++) 
            {
                var b = bricks[c][r];
                if(b.status == 1) 
                {
                    if(x > b.x && x < b.x+brickWidth && y > b.y && y < b.y+brickHeight) //检测球是否碰撞砖块
                    {
                        dy = -dy;//球反向
                        b.status = 0;//砖块状态置0
                        score++;
                        if(score == brickRowCount*brickColumnCount) //检测胜利
                        {
                            alert("YOU WIN, CONGRATS!");
                            document.location.reload();
                        }
                    }
                }
            }
        }
    }

    function drawBall() //绘制球
    {
        ctx.beginPath();//beginPath~closePath绘制
        ctx.arc(x, y, ballRadius, 0, Math.PI*2);//(x，y，半径，起始角度，结束角度，顺时针方向)
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
    }
    function drawPaddle() //绘制挡板
    {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);//(x，y，宽，高)
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
    }
    function drawBricks() //绘制砖块
    {
        for(var c=0; c<brickColumnCount; c++) 
        {
            for(var r=0; r<brickRowCount; r++) 
            {
                if(bricks[c][r].status == 1) //未被击中的砖块才绘制
                {
                    var brickX = (r*(brickWidth+brickPadding))+brickOffsetLeft;
                    var brickY = (c*(brickHeight+brickPadding))+brickOffsetTop;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = "#0095DD";
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }
    function drawScore() //绘制分数
    {
        ctx.font = "16px Arial";
        ctx.fillStyle = "#0095DD";
        ctx.fillText("Score: "+score, 8, 20);
    }
    function drawLives() //绘制生命值
    {
        if (!gameStarted) return; // 防止未选择难度时启动绘制
        ctx.font = "16px Arial";
        ctx.fillStyle = "#0095DD";
        ctx.fillText("Lives: "+lives, canvas.width-65, 20);
    }

    function draw() 
    {
        ctx.clearRect(0, 0, canvas.width, canvas.height);//清除画布
        drawBricks();
        drawBall();
        drawPaddle();
        drawScore();
        drawLives();
        collisionDetection();

        if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) //碰到左右边反弹
        {
            dx = -dx;
        }
        if(y + dy < ballRadius)//碰到上边反弹 
        {
            dy = -dy;
        }
        else if(y + dy > canvas.height-ballRadius) //碰到下边
        {
            if(x > paddleX && x < paddleX + paddleWidth) //检测球是否碰到挡板
            {
                dy = -dy;
            }
            else 
            {
                lives--;
                if(!lives) 
                {
                    alert("GAME OVER");
                    document.location.reload();
                }
                else //重置球和挡板位置
                {
                    x = canvas.width/2;
                    y = canvas.height-30;
                    //根据难度重置球速
                    if (difficulty === "easy") {
                        dx = 2; dy = -2;
                    } else if (difficulty === "hard") {
                        dx = 5; dy = -5;
                    } else {
                        dx = 3; dy = -3;
                    }
                    paddleX = (canvas.width-paddleWidth)/2;
                }
            }
        }

        if(rightPressed && paddleX < canvas.width-paddleWidth) //移动挡板
        {
            paddleX += 7;
        }
        else if(leftPressed && paddleX > 0) 
        {
            paddleX -= 7;
        }

        x += dx;
        y += dy;
        requestAnimationFrame(draw);
    }
    draw();
</script>

</body>
</html>
