<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Gamedev Canvas Workshop - lesson 1: create the Canvas and draw on it</title>
    <style>* { padding: 0; margin: 0; } canvas { background: #eee; display: block; margin: 0 auto; }</style>
</head>
<body>

<canvas id="myCanvas" width="480" height="320"></canvas> <!--创建一个画布，指定宽高-->

<script> //以下为JavaScript代码
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    ctx.beginPath();
    ctx.rect(20, 40, 50, 50);//20 40 是起点坐标，50 50 是宽高
    ctx.fillStyle = "#FF0000"; //填充颜色
    ctx.fill();
    ctx.closePath();//beginpath~closepath创建图形

    ctx.beginPath();
    ctx.arc(240, 160, 20, 0, Math.PI*2, false);//圆心坐标 240 160，半径20，起始弧度0，终止弧度2π, 顺时针
    ctx.fillStyle = "green";
    ctx.fill();
    ctx.closePath();

    ctx.beginPath();
    ctx.rect(160, 10, 100, 40);
    ctx.strokeStyle = "rgba(0, 0, 255, 0.5)";
    ctx.stroke();
    ctx.closePath();
</script>

</body>
</html>
