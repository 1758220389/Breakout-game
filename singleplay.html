    body {
    background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);

<script>//以下为JS代码
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");

    // 充值系统变量
    var currentRechargeType = ""; // 当前选择的充值类型
    var isResetting = false; // 重置状态标志
    
// 等待DOM完全加载
document.addEventListener('DOMContentLoaded', function() 
{
    // 创建浮动砖块背景
    function createFloatingBricks() {
    const container = document.getElementById('floatingBricks');
    const brickCount = 15;
    
    for (let i = 0; i < brickCount; i++) {
        const brick = document.createElement('div');
        brick.classList.add('brick');
        
        // 随机位置
        const left = Math.random() * 100;
        brick.style.left = `${left}%`;
        
        // 随机大小
        const size = 20 + Math.random() * 30;
        brick.style.width = `${size}px`;
        brick.style.height = `${size/2}px`;
        
        // 随机颜色
        const hue = Math.random() * 360;
        brick.style.background = `linear-gradient(45deg, hsl(${hue}, 100%, 60%), hsl(${hue + 30}, 100%, 50%))`;
        
        // 随机延迟和持续时间
        const delay = Math.random() * 15;
        const duration = 15 + Math.random() * 15;
        brick.style.animationDelay = `${delay}s`;
        brick.style.animationDuration = `${duration}s`;
        
        container.appendChild(brick);
    }
}

// 初始化浮动砖块
createFloatingBricks();
    //难度选择按钮事件监听
    document.getElementById("easyBtn").addEventListener("click", function() {startGame("easy");});
    document.getElementById("mediumBtn").addEventListener("click", function() {startGame("medium");});
    document.getElementById("hardBtn").addEventListener("click", function() {startGame("hard");});



    // 充值按钮事件监听
    document.getElementById("rechargeBtn").addEventListener("click", function() {
        showRechargeMenu();
    });

    // 充值类型选择
    document.getElementById("rechargeLives").addEventListener("click", function() {
        currentRechargeType = "lives";
        showRechargeLevels();
    });

    document.getElementById("rechargePaddle").addEventListener("click", function() {
        currentRechargeType = "paddle";
        showRechargeLevels();
    });

    // 充值档位按钮事件监听
    document.querySelectorAll('.rechargeLevel').forEach(button => {
    button.addEventListener('click', function() {
        applyRecharge(parseInt(this.getAttribute('data-value')));
    });
    });

    // 返回按钮事件监听
    document.getElementById('backBtn').addEventListener('click', function() {
    hideRechargeMenu();
    });

    // 重置按钮事件监听
    document.getElementById("resetBtn").addEventListener("click", function() {
    if (!isResetting) {resetPositions();}
    });

    // 分数记录按钮事件监听
    document.getElementById("leaderboardBtn").addEventListener("click", showLeaderboard);
    document.getElementById("exportBtn").addEventListener("click", exportToCSV);
    document.getElementById("clearBtn").addEventListener("click", clearAllRecords);
});

    function startGame(level) 
    {
        difficulty = level;
        gameEnded = false;
        if (level === "easy") {dx = 2; dy = -2; defaultPaddleWidth = 200; paddleWidth = defaultPaddleWidth;} 
        else if (level === "medium") {dx = 3; dy = -3; defaultPaddleWidth = 180; paddleWidth = defaultPaddleWidth;} 
        else if (level === "hard"){dx = 4; dy = -4; defaultPaddleWidth = 150; paddleWidth = defaultPaddleWidth;} 

        //初始化游戏状态
        gameState.dx = dx;
        gameState.dy = dy;
        gameState.paddleWidth = paddleWidth;
        gameState.isTankBall = false;
        gameState.score = score;
        gameState.lives = 10000;

        // 隐藏难度选择界面，显示游戏画布
        document.getElementById("difficultyContainer").style.display = "none";
        canvas.style.display = "block";

        // 显示充值按钮
        document.getElementById("rechargeBtn").style.display = "block";
        document.getElementById("resetBtn").style.display = "block";
        
        // 显示分数记录系统按钮
        document.getElementById("leaderboardBtn").style.display = "block";
        document.getElementById("exportBtn").style.display = "block";
        document.getElementById("clearBtn").style.display = "block";

        // 显示说明面板
        document.getElementById("leftInstructions").style.display = "block";
        document.getElementById("rightInstructions").style.display = "block";

        // 初始化游戏状态
        ballLunched = false;
        initBricks();
        gameStarted = true;
        draw();
    }

    var ballRadius = 10;//球的半径
    var x = canvas.width/2;//球的初始位置
    var y = canvas.height-30;
    var dx ;//球的水平速度
    var dy ;//球的竖直速度

    var defaultPaddleWidth = 200;
    var paddleHeight = 10;//挡板尺寸
    var paddleWidth = 120;
    var paddleX = (canvas.width-paddleWidth)/2;//挡板的初始位置
    var paddleY = canvas.height - paddleHeight;
    var prevPaddleX = paddleX; // 记录上一帧挡板位置
    var paddleSpeed = 0; // 挡板当前速度

    var rightPressed = false;//按键状态
    var leftPressed = false;

    var brickRowCount = 36;//砖块摆放
    var brickColumnCount = 13;
    var brickWidth = 25;//砖块尺寸
    var brickHeight = 25;
    var brickPadding = 3;//砖块间距
    var brickOffsetTop = 30;//砖块起始位置
    var brickOffsetLeft = 30;

    var normalBrick = 0;//砖块类型，0普通砖块
    var hardBrick = 1;
    var vectorBrickUp = 2;//矢量砖块
    var vectorBrickDown = 3;
    var vectorBrickLeft = 4;
    var vectorBrickRight = 5;
    var boomBrick = 6;
    var chainBrick = 7;//连锁砖块
    var motherBrick = 8;//子母砖块

    var longPaddle = 9;
    var lifeUp = 10;
    var extraBall = 11;
    var speedDown = 12;//减速
    var tankBall = 13;//穿透因子

    var gameState = //这啥 传参的？
    {score: 0, lives: 1000, hitSide: "0", paddleWidth: 120, isTankBall: false, dx: 0, dy: 0, effectFactor: [],
        extraBalls: [], x: 0, y: 0
    };
    
    
    var score = 0;
    var ballLunched = false;
    var gameEnded = false;

    var bricks = [];


    function initBricks() //砖块数组初始化
    {
        bricks = [];
        for(var c=0; c<brickColumnCount; c++) 
        {
            bricks[c] = [];
            for(var r=0; r<brickRowCount; r++) 
            {
                var isSpecial = Math.random() < 0.2;//20%概率生成特殊砖块
                if (isSpecial) 
                {
                    //随机数生成特殊砖块类型
                    var specialType = Math.floor(Math.random() * 13) + 1; // 1-8的随机数对应不同的特殊砖块
                } 
                else 
                {
                    specialType = normalBrick;
                }

                bricks[c][r] = { x: 0, y: 0, specialBrick: specialType, status: 1 };

                if (bricks[c][r].specialBrick === hardBrick)
                {
                    bricks[c][r].status = 2; // 硬砖需要两次击打
                }
            }
        }
    }

    function collisionDetection()//小球和砖块碰撞函数
    {
        for(var c=0; c<brickColumnCount; c++) 
        {
            for(var r=0; r<brickRowCount; r++) 
            {
                var b = bricks[c][r];
                if(b.status >= 1) 
                {
                    if(x + ballRadius > b.x && x - ballRadius < b.x + brickWidth && y + ballRadius > b.y && y - ballRadius < b.y + brickHeight)
                    {
                        // 确定球和砖块碰撞的边
                        var distToLeft = Math.abs((x + ballRadius) - b.x);
                        var distToRight = Math.abs((x - ballRadius) - (b.x + brickWidth));
                        var distToTop = Math.abs((y + ballRadius) - b.y);
                        var distToBottom = Math.abs((y - ballRadius) - (b.y + brickHeight));
                        
                        var minDist = Math.min(distToLeft, distToRight, distToTop, distToBottom);
                        if (minDist === distToLeft) {gameState.hitSide = "left";} 
                        else if (minDist === distToRight) {gameState.hitSide = "right";} 
                        else if (minDist === distToTop) {gameState.hitSide = "top";} 
                        else {gameState.hitSide = "bottom";}             
                        // 先处理反弹再处理方块特效
                        // 只有砖块被摧毁时才反弹（除非是穿透球）
                    if(!gameState.isTankBall) 
                    {
                        // 计算碰撞方向
                        var ballCenterX = x;
                        var ballCenterY = y;
                        var brickCenterX = b.x + brickWidth/2;
                        var brickCenterY = b.y + brickHeight/2;
                        
                        var dxCenter = ballCenterX - brickCenterX;
                        var dyCenter = ballCenterY - brickCenterY;
                        
                        // 根据碰撞方向反弹
                        if(Math.abs(dxCenter) > Math.abs(dyCenter)) 
                        {
                            // 水平碰撞
                            dx = -dx;
                            gameState.dx = dx;
                        } 
                        else 
                        {
                            // 垂直碰撞
                            dy = -dy;
                            gameState.dy = dy;
                        }
                    
                        brickEffect(b, c, r, bricks, brickColumnCount, brickRowCount, gameState);
                        // 更新游戏状态
                        score = gameState.score;
                        paddleWidth = gameState.paddleWidth;
                        dx = gameState.dx;
                        dy = gameState.dy;
                        return;
                    }
                    else//穿透球模式
                    {
                        brickEffect(b, c, r, bricks, brickColumnCount, brickRowCount, gameState);
                        score = gameState.score;
                        paddleWidth = gameState.paddleWidth;
                    }

                    return;// 一次只处理一个碰撞
                    }
                }
            }
        }
    }

    function countActiveBricks() 
    {
        var count = 0;
        for(var c=0; c<brickColumnCount; c++) 
        {
            for(var r=0; r<brickRowCount; r++) 
            {
                if(bricks[c][r].status > 0) 
                {
                    count++;
                }
            }
        }
        return count;
    }

    function checkEffectFactorCollision(ball)
    {
        for(var c=0;c<brickColumnCount;c++)
        {
            for(var r=0;r<brickRowCount;r++)
            {
                var b = bricks[c][r];
                if(b.status >= 1)
                {
                    if(ball.x + ballRadius > b.x && ball.x - ballRadius < b.x + brickWidth && ball.y + ballRadius > b.y && ball.y - ballRadius < b.y + brickHeight)
                    {
                        var distToLeft = Math.abs((ball.x + ballRadius) - b.x);
                        var distToRight = Math.abs((ball.x - ballRadius) - (b.x + brickWidth));
                        var distToTop = Math.abs((ball.y + ballRadius) - b.y);
                        var distToBottom = Math.abs((ball.y - ballRadius) - (b.y + brickHeight));
                        var minDist = Math.min(distToLeft, distToRight, distToTop, distToBottom);
                        if (minDist === distToLeft) {gameState.hitSide = "left";} 
                        else if (minDist === distToRight) {gameState.hitSide = "right";} 
                        else if (minDist === distToTop) {gameState.hitSide = "top";} 
                        else {gameState.hitSide = "bottom";}

                        var ballCenterX = ball.x;
                        var ballCenterY = ball.y;
                        var brickCenterX = b.x + brickWidth/2;
                        var brickCenterY = b.y + brickHeight/2;
                        var dxCenter = ballCenterX - brickCenterX;
                        var dyCenter = ballCenterY - brickCenterY;

                        if(Math.abs(dxCenter) > Math.abs(dyCenter)) 
                        {
                            ball.dx = -ball.dx;
                        } 
                        else 
                        {
                            ball.dy = -ball.dy;
                        }
                        brickEffect(b, c, r, bricks, brickColumnCount, brickRowCount, gameState);
                        score = gameState.score;
                        paddleWidth = gameState.paddleWidth;
                    }
                }
            }
        }
    }

    function updateEffectFactor()
    {
        if(!gameState.effectFactor) return;

        for(var i = gameState.effectFactor.length - 1; i >= 0; i--) 
        {
            var factor = gameState.effectFactor[i];
            factor.y += factor.speed;

            // 检测是否被挡板接住
            if(factor.y + factor.height >= paddleY && factor.y <= paddleY + paddleHeight &&
               factor.x + factor.width >= paddleX && factor.x <= paddleX + paddleWidth) 
            {
                // 应用效果
                applyEffectFactor(factor.effectType, gameState);
                paddleWidth = gameState.paddleWidth;
                dx = gameState.dx;
                dy = gameState.dy;
                lives = gameState.lives;
                // 从数组中移除该效果因子
                gameState.effectFactor.splice(i, 1);
            }
            // 如果掉落到画布底部，移除该效果因子
            else if(factor.y > canvas.height) 
            {
                gameState.effectFactor.splice(i, 1);
            }
        }
    }


    document.addEventListener("keydown", keyDownHandler, false);//监听按键 按下
    document.addEventListener("keyup", keyUpHandler, false);//监听按键 松开
    document.addEventListener("mousemove", mouseMoveHandler, false); //监听鼠标移动

    function keyDownHandler(e) //addEventListener监听到按键时返回e
    {
        if(e.code  == "ArrowRight") 
        {
            rightPressed = true;
        }
        else if(e.code == 'ArrowLeft') 
        {
            leftPressed = true;
        }
        else if(e.code == 'ArrowUp' && gameStarted && !ballLunched) //发射球
        {
             ballLunched = true;
        }
    }
    function keyUpHandler(e) 
    {
        if(e.code == 'ArrowRight') 
        {
            rightPressed = false;
        }
        else if(e.code == 'ArrowLeft') 
        {
            leftPressed = false;
        }
        
    }
/*     
    function mouseMoveHandler(e) //鼠标控制
    {
        var relativeX = e.clientX - canvas.offsetLeft;
        if(relativeX > 0 && relativeX < canvas.width) {
            paddleX = relativeX - paddleWidth/2;
        }
    } 
*/

    function draw() 
    {    
        ctx.clearRect(0, 0, canvas.width, canvas.height);//清除画布
        if(!ballLunched) //球未发射时，球跟随挡板
        {
            gameState.paddleWidth = paddleWidth;//重置增益
            x = paddleX + paddleWidth/2;
            y = paddleY - ballRadius;
            gameState.isTankBall = false;
            gameState.dx = dx;
            gameState.dy = dy;
            gameState.extraBalls = [];
        }
        drawBricks(ctx, bricks, brickColumnCount, brickRowCount, brickWidth, brickHeight, brickPadding, brickOffsetTop, brickOffsetLeft);
        drawBall(ctx, x, y, ballRadius, "#0095DD");
        drawPaddle(ctx, paddleX, paddleY,gameState.paddleWidth, paddleHeight);
        drawScore(ctx, score);
        drawLives(ctx, gameState.lives);
        if(!gameEnded)
        {
        collisionDetection();
        updateEffectFactor();
        drawEffectFactor(ctx, gameState.effectFactor);
        
        // 计算挡板速度（基于上一帧和当前帧的位置差）
        paddleSpeed = (paddleX - prevPaddleX) / 1; // 除以时间（这里假设每帧时间相同）
        prevPaddleX = paddleX; // 更新上一帧位置

        gameState.x = x;
        gameState.y = y;

        if(gameState.extraBalls && gameState.extraBalls.length > 0)//处理额外小球
        {
            for(var i = gameState.extraBalls.length - 1; i >= 0; i--)
            {
                var ball = gameState.extraBalls[i];
                drawBall(ctx, ball.x, ball.y, ball.radius, "#ff0000ff");
                checkEffectFactorCollision(ball);

                if(ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) 
                {
                    ball.dx = -ball.dx;
                }
                if(ball.y + ball.dy < ball.radius) 
                {
                    ball.dy = -ball.dy;
                }
                else if(ball.y + ball.dy > canvas.height - ball.radius) 
                {
                    if( ball.x > paddleX && ball.x < paddleX + gameState.paddleWidth && 
                    ball.y + ball.radius >= paddleY && ball.dy > 0) 
                    {
                        ball.dy = -ball.dy;
                    }
                    else 
                    {
                        gameState.extraBalls.splice(i, 1);
                        continue;
                    }
                }
                checkEffectFactorCollision(ball);
                ball.x += ball.dx;
                ball.y += ball.dy;
            }
        }

        if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) //碰到左右边反弹
        {
            dx = -dx;
        }
        if(y + dy < ballRadius)//碰到上边反弹 
        {
            dy = -dy;
        }
        else if(y + dy > canvas.height-ballRadius) //碰到下边
        {
            if(x > paddleX && x < paddleX + paddleWidth) //检测球是否碰到挡板
            {
            // 球与挡板碰撞
            
            // 计算碰撞点在挡板上的相对位置 (-0.5 到 0.5)
            var hitPos = (x - (paddleX + paddleWidth/2)) / (paddleWidth/2);
            
            // 基础反弹（垂直方向）
            dy = -Math.abs(dy); // 确保向上弹
            
            // 根据挡板速度影响球的水平速度
            var speedTransferFactor = 0.5; // 速度传递系数，可调整
            dx += paddleSpeed * speedTransferFactor;
            
            // 根据碰撞点位置添加水平偏移
            var angleFactor = 2; // 角度影响系数，可调整
            dx += hitPos * angleFactor;
            
            // 限制最大水平速度，防止过快
            var maxDx = 10;
            if(dx > maxDx) dx = maxDx;
            if(dx < -maxDx) dx = -maxDx;
            
            // 确保最小垂直速度
            var minDy = 2;
            if(Math.abs(dy) < minDy) {
                dy = (dy > 0 ? minDy : -minDy);
            }
        }
            else 
            {
                ballLunched = false;//重置球发射状态
                gameState.lives--;
                if(!gameState.lives) 
                {
                    handleGameOver(score, difficulty);
                    document.location.reload();
                    return;
                }
                else //重置球和挡板位置
                {
                    x = canvas.width/2;
                    y = canvas.height-30;
                    //根据难度重置球速
                    if (difficulty === "easy") 
                    {
                        dx = 2; dy = -2;
                        paddleWidth = defaultPaddleWidth;
                        //paddleWidth = 200;
                    } 
                    else if (difficulty === "hard") 
                    {
                        dx = 4; dy = -4;
                        paddleWidth = 180;
                    } 
                    else 
                    {
                        dx = 3; dy = -3;
                        paddleWidth = 150;
                    }
                    paddleX = (canvas.width-paddleWidth)/2;
                }
            }
        }

        if(rightPressed && paddleX < canvas.width-paddleWidth) //移动挡板
        {
            paddleX += 7;
        }
        else if(leftPressed && paddleX > 0) 
        {
            paddleX -= 7;
        }

        x += dx;
        y += dy;
        if(countActiveBricks() === 0 ) // 检查胜利条件
        {
            gameEnded = true;
            setTimeout(function(){
            handleGameWin(score, difficulty, gameState.lives);
            document.location.reload();
            }, 100);
        }
        requestAnimationFrame(draw);
    }
    }



    // 显示充值菜单
    function showRechargeMenu() 
    {
        document.getElementById("rechargeContainer").style.display = "flex";
        document.getElementById("rechargeOptions").style.display = "block";
        document.getElementById("rechargeLevels").style.display = "none";
    }

    // 显示充值档位
    function showRechargeLevels() 
    {
    document.getElementById("rechargeOptions").style.display = "none";
    document.getElementById("rechargeLevels").style.display = "block";
    
    // 更新标题和按钮文本
    var title = document.getElementById("rechargeTitle");
    var buttons = document.querySelectorAll('.rechargeLevel');
    
    if (currentRechargeType === "lives") 
    {
        title.textContent = "生命值充值档位";
        buttons[0].textContent = "小充一笔 (生命值+5)";
        buttons[1].textContent = "充一笔 (生命值+10)";
        buttons[2].textContent = "猛充 (生命值+20)";
    } 
    else 
    {
        title.textContent = "挡板长度充值档位";
        buttons[0].textContent = "小充一笔 (挡板长度+5px)";
        buttons[1].textContent = "充一笔 (挡板长度+10px)";
        buttons[2].textContent = "猛充 (挡板长度+20px)";
    }
    }
    // 应用充值效果
    function applyRecharge(value) 
    {
        if (currentRechargeType === "lives") {gameState.lives += value;}// 增加生命值
        else if (currentRechargeType === "paddle") 
        {
            defaultPaddleWidth = defaultPaddleWidth + value;// 增加挡板长度
            gameState.paddleWidth = defaultPaddleWidth;
            paddleWidth = defaultPaddleWidth;
        }
        
        hideRechargeMenu();// 隐藏充值界面
        
        // 显示“充值成功”提示，2秒后自动隐藏
        var tip = document.getElementById('rechargeSuccess');
        tip.style.display = 'block';
        setTimeout(function(){tip.style.display = 'none';}, 2000);
    }
    // 隐藏充值菜单
    function hideRechargeMenu() {document.getElementById("rechargeContainer").style.display = "none";}


    // 重置球和挡板位置的函数
    function resetPositions() 
    {
        isResetting = true;
        var resetBtn = document.getElementById("resetBtn");
    
        // 禁用按钮并显示倒计时
        resetBtn.disabled = true;
        var countdown = 2;
        resetBtn.textContent = `重置中... (${countdown}s)`;
    
        var countdownInterval = setInterval(function() {
        countdown--;
        if (countdown > 0) {
            resetBtn.textContent = `重置中... (${countdown}s)`;
        }
        }, 1000);
    
        // 2秒后执行重置
        setTimeout(function() {clearInterval(countdownInterval);
        
        // 重置球的位置
        ballLunched = false;
        x = canvas.width / 2;
        y = canvas.height - 30;
        
        // 根据难度重置球速
        if (difficulty === "easy") {dx = 2; dy = -2;} 
        else if (difficulty === "medium") {dx = 3; dy = -3;} 
        else if (difficulty === "hard") {dx = 4; dy = -4;}
        
        // 重置挡板位置
        paddleX = (canvas.width - paddleWidth) / 2;
        
        // 清除额外的球和效果因子
        gameState.extraBalls = [];
        gameState.effectFactor = [];
        gameState.isTankBall = false;
        gameState.dx = dx;
        gameState.dy = dy;
        
        // 恢复按钮状态
        isResetting = false;
        resetBtn.disabled = false;
        resetBtn.textContent = "重置位置 (2s)";
    }, 2000);
}
