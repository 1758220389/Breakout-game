<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Gamedev Canvas Workshop - lesson 4: paddle and keyboard controls</title>
    <style>* { padding: 0; margin: 0; } canvas { background: #eee; display: block; margin: 0 auto; }</style>
</head>
<body>

<canvas id="myCanvas" width="480" height="320"></canvas>

<script>
    var canvas = document.getElementById("myCanvas");
    var ctx = canvas.getContext("2d");
    var ballRadius = 10;
    var x = canvas.width/2;
    var y = canvas.height-30;
    var dx = 2;
    var dy = -2;
    var paddleHeight = 10;
    var paddleWidth = 75;//挡板宽高
    var paddleX = (canvas.width-paddleWidth)/2;//挡板初始位置
    var rightPressed = false;
    var leftPressed = false;

    document.addEventListener("keydown", keyDownHandler, false);//监听键盘按下事件
    document.addEventListener("keyup", keyUpHandler, false);//监听键盘松开事件

    function keyDownHandler(e) //e由addeventlistener传入，包含按键信息
    {
        if(e.code  == "ArrowRight") //e.code查询keycode得到
        {
            rightPressed = true;//传递移动信息
        }
        else if(e.code == 'ArrowLeft') 
        {
            leftPressed = true;
        }
    }
    function keyUpHandler(e) 
    {
        if(e.code  == "ArrowRight") 
        {
            rightPressed = false;
        }
        else if(e.code == 'ArrowLeft') 
        {
            leftPressed = false;
        }
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(x, y, ballRadius, 0, Math.PI*2);
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
    }
    function drawPaddle() {
        ctx.beginPath();
        ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight);
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBall();
        drawPaddle();

        if(x + dx > canvas.width-ballRadius || x + dx < ballRadius) {
            dx = -dx;
        }
        if(y + dy > canvas.height-ballRadius || y + dy < ballRadius) {
            dy = -dy;
        }

        if(rightPressed && paddleX < canvas.width-paddleWidth) //当且仅当按下右键且挡板未到达右边界
        {
            paddleX += 7;
        }
        else if(leftPressed && paddleX > 0) 
        {
            paddleX -= 7;
        }

        x += dx;
        y += dy;
    }

    setInterval(draw, 10);
</script>

</body>
</html>
